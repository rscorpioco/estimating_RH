<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorpio Preconstruction — CM Project Startup Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Scorpio Preconstruction</h1>
      <p class="subtitle">CM Project Startup Tracker</p>
    </div>
    <button id="newProjectBtn" class="btn btn-primary btn-block">+ New Project</button>
    <div id="projectList" class="project-list"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty-state" id="emptyState">
      <p>Select a project or create a new one to get started.</p>
    </div>
    <div class="project-detail" id="projectDetail" hidden></div>
  </main>
</div>

<dialog id="opportunityDialog" class="nof-dialog">
  <div class="nof-header">
    <div>
      <h2>New Opportunity Form</h2>
      <p class="nof-sub" id="opportunityProjectName"></p>
    </div>
    <button type="button" class="btn" id="closeOpportunityBtn" aria-label="Close">Close</button>
  </div>
  <div class="nof-body" id="opportunityFormBody"></div>
  <div class="nof-footer">
    <span class="nof-progress" id="opportunityProgress"></span>
    <div class="nof-footer-actions">
      <button type="button" class="btn" id="exportOpportunityBtn">Export .xlsx</button>
      <button type="button" class="btn btn-primary" id="saveOpportunityBtn">Save</button>
    </div>
  </div>
</dialog>

<dialog id="scheduleDialog" class="schedule-dialog">
  <div class="nof-header">
    <div>
      <h2>Meeting &amp; Task Schedule</h2>
      <p class="nof-sub" id="scheduleProjectName"></p>
    </div>
    <button type="button" class="btn" id="closeScheduleBtn" aria-label="Close">Close</button>
  </div>
  <div class="nof-body" id="scheduleBody"></div>
  <div class="nof-footer">
    <span class="nof-progress">Nothing is sent anywhere — this is a preview only.</span>
    <div class="nof-footer-actions">
      <button type="button" class="btn btn-primary" id="closeScheduleBtn2">Close</button>
    </div>
  </div>
</dialog>

<dialog id="kickoffDialog" class="nof-dialog">
  <div class="nof-header">
    <div>
      <h2 id="kickoffDialogTitle">Kickoff / Bid Day Package</h2>
      <p class="nof-sub" id="kickoffProjectName"></p>
    </div>
    <button type="button" class="btn" id="closeKickoffBtn" aria-label="Close">Close</button>
  </div>
  <div class="nof-body" id="kickoffBody"></div>
  <div class="nof-footer">
    <span class="nof-progress" id="kickoffProgress"></span>
    <div class="nof-footer-actions">
      <button type="button" class="btn btn-primary" id="exportKickoffBtn">Export Package (.pdf)</button>
    </div>
  </div>
</dialog>

<dialog id="kickoffZoomDialog" class="kickoff-zoom-dialog">
  <div class="kickoff-zoom-header">
    <span id="kickoffZoomPageLabel">Page 1</span>
    <select id="kickoffZoomSelect"></select>
    <button type="button" class="btn" id="closeKickoffZoomBtn" aria-label="Close">Close</button>
  </div>
  <div class="kickoff-zoom-body">
    <button type="button" class="btn kickoff-zoom-nav" id="kickoffZoomPrev">‹ Prev</button>
    <div class="kickoff-zoom-canvas-wrap">
      <canvas id="kickoffZoomCanvas"></canvas>
    </div>
    <button type="button" class="btn kickoff-zoom-nav" id="kickoffZoomNext">Next ›</button>
  </div>
</dialog>

<dialog id="projectDialog">
  <form id="projectForm" method="dialog">
    <h2 id="projectDialogTitle">New Project</h2>
    <label>Project Name
      <input type="text" id="fieldName" required placeholder="e.g. UF Chemistry Building Renovation" />
    </label>
    <label>Location
      <select id="fieldLocation"></select>
    </label>
    <label>Delivery Method
      <select id="fieldDelivery"></select>
    </label>
    <label>Team Lead
      <select id="fieldTeamLead"></select>
    </label>
    <label>Activate Date <span class="hint">(day 1 — deadlines are computed from this date)</span>
      <input type="date" id="fieldActivateDate" required />
    </label>
    <label>Subcontractor Bid Due Date <span class="hint">(optional — computes the meeting schedule)</span>
      <input type="date" id="fieldBidDueDate" />
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn" id="cancelProjectBtn">Cancel</button>
      <button type="submit" class="btn btn-primary" id="saveProjectBtn">Save</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
  window.pdfjsLib = pdfjsLib;
</script>
<script src="checklist-data.js"></script>
<script src="app.js"></script>
</body>
</html>
